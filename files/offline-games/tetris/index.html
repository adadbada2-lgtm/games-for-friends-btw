<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тетрис · портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0e1013;
    --card: #171b21;
    --card-hover: #1c212a;
    --border: #262b34;
    --border-hover: #4fd8c4;
    --text: #eae8e3;
    --text-dim: #888e99;
    --text-faint: #565c68;
    --accent: #4fd8c4;
    --danger: #e0607a;
    --radius: 16px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,216,196,0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 0%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .backlink{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-faint);
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: color .2s ease;
  }
  .backlink:hover{ color: var(--accent); }

  header{
    text-align: center;
    margin: 30px 0 34px;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before, .eyebrow::after{
    content: "";
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .eyebrow::after{ background: linear-gradient(90deg, var(--accent), transparent); }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 44px);
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }

  header p{
    color: var(--text-dim);
    font-size: 14.5px;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .layout{
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 22px;
    align-items: start;
  }

  .board-frame{
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  canvas#field{
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    background: #12151a;
  }

  .side{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }

  .hud-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .hud-value{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 22px;
  }

  .panel.accent-val .hud-value{ color: var(--accent); }

  #next{
    display: block;
    width: 100%;
    height: auto;
    background: #12151a;
    border-radius: 8px;
    margin-top: 4px;
  }

  .btn{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    color: var(--text);
    background: var(--card-hover);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
    width: 100%;
  }
  .btn:hover{ border-color: var(--border-hover); color: var(--accent); }
  .btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .overlay{
    position: absolute;
    inset: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(14,16,19,0.88);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show{ display: flex; }

  .overlay-title{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }
  .overlay-title.dead{ color: var(--danger); }

  .overlay p{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
  }

  .hint{
    text-align: center;
    margin-top: 20px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  .dpad{
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 8px;
    justify-content: center;
    margin-top: 22px;
  }
  .dpad button{
    font-size: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .dpad button:active{ background: var(--card-hover); border-color: var(--accent); }
  #rotBtn{ grid-column: 2; grid-row: 1; }
  #leftBtn{ grid-column: 1; grid-row: 2; }
  #downBtn{ grid-column: 2; grid-row: 2; }
  #rightBtn{ grid-column: 3; grid-row: 2; }

  @media (max-width: 640px){
    .layout{ grid-template-columns: 1fr; }
    .side{ flex-direction: row; flex-wrap: wrap; }
    .panel{ flex: 1; min-width: 130px; }
    .dpad{ display: grid; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="backlink" href="../../portal.html">← портал</a>

    <header>
      <div class="eyebrow">оффлайн</div>
      <h1>Тетрис</h1>
      <p>Собирай полные линии — они исчезают и приносят очки</p>
    </header>

    <div class="layout">
      <div class="board-frame">
        <canvas id="field" width="300" height="600"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-title" id="overlayTitle">Пауза</div>
          <p id="overlayText">Нажми пробел, чтобы продолжить</p>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <div class="hud-label">Следующая</div>
          <canvas id="next" width="120" height="80"></canvas>
        </div>
        <div class="panel accent-val">
          <div class="hud-label">Счёт</div>
          <div class="hud-value" id="score">0</div>
        </div>
        <div class="panel">
          <div class="hud-label">Уровень</div>
          <div class="hud-value" id="level">1</div>
        </div>
        <div class="panel">
          <div class="hud-label">Линии</div>
          <div class="hud-value" id="lines">0</div>
        </div>
        <div class="panel">
          <div class="hud-label">Рекорд</div>
          <div class="hud-value" id="best" style="color:var(--accent)">0</div>
        </div>
        <button class="btn" id="restart">Заново</button>
      </div>
    </div>

    <div class="hint">← → сдвиг · ↑ поворот · ↓ ускорить · пробел — сброс · P — пауза</div>

    <div class="dpad">
      <button id="rotBtn">⟳</button>
      <button id="leftBtn">←</button>
      <button id="downBtn">↓</button>
      <button id="rightBtn">→</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const restartBtn = document.getElementById('restart');

  const COLS = 10, ROWS = 20;
  const cell = canvas.width / COLS;

  const COLORS = {
    I: '#4fd8c4',
    O: '#e0c04f',
    T: '#a878e0',
    S: '#6fd876',
    Z: '#e0607a',
    J: '#5b8fe0',
    L: '#e0934f'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };

  const NAMES = Object.keys(SHAPES);

  let board, curName, curRot, pos, nextName, score, level, lines, best;
  let running, gameOver, dropTimer, dropMs;

  best = parseInt(localStorage.getItem('tetris-best') || '0', 10);
  bestEl.textContent = best;

  function emptyBoard(){
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  // Local coords stay inside a fixed 4x4 box; rotation is a matrix rotation
  // about that box's center, so a piece always rotates in place around a
  // stable anchor rather than needing a re-derived offset each time.
  function rotateLocal(cells, rot){
    let pts = cells.map(([x,y]) => [x,y]);
    for(let i=0;i<rot;i++){
      pts = pts.map(([x,y]) => [3 - y, x]);
    }
    return pts;
  }

  function cellsFor(name, rot, p){
    return rotateLocal(SHAPES[name], rot).map(([lx,ly]) => ({x: p.x + lx, y: p.y + ly}));
  }

  function curCells(){
    return cellsFor(curName, curRot, pos);
  }

  function spawn(){
    curName = nextName || NAMES[Math.floor(Math.random()*NAMES.length)];
    nextName = NAMES[Math.floor(Math.random()*NAMES.length)];
    curRot = 0;
    pos = { x: 3, y: 0 };
    if (collides(curCells())){
      die();
    }
    drawNext();
  }

  function collides(cells, dx=0, dy=0){
    return cells.some(({x,y}) => {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny < 0) return false;
      return board[ny][nx] !== null;
    });
  }

  function lockPiece(){
    curCells().forEach(({x,y}) => {
      if (y >= 0) board[y][x] = curName;
    });
    clearLines();
    spawn();
    draw();
  }

  function clearLines(){
    let cleared = 0;
    for(let r = ROWS-1; r >= 0; r--){
      if (board[r].every(v => v !== null)){
        board.splice(r,1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared > 0){
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      dropMs = Math.max(120, 700 - (level-1)*55);
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
      if (score > best){
        best = score;
        localStorage.setItem('tetris-best', best);
        bestEl.textContent = best;
      }
      restartTimer();
    }
  }

  function move(dx){
    if (!running || gameOver) return;
    if (!collides(curCells(), dx, 0)){
      pos.x += dx;
      draw();
    }
  }

  function softDrop(){
    if (!running || gameOver) return;
    if (!collides(curCells(), 0, 1)){
      pos.y += 1;
      score += 1;
      scoreEl.textContent = score;
      draw();
    } else {
      lockPiece();
    }
  }

  function hardDrop(){
    if (!running || gameOver) return;
    let d = 0;
    while(!collides(curCells(), 0, d+1)) d++;
    pos.y += d;
    score += d*2;
    scoreEl.textContent = score;
    lockPiece();
  }

  function rotate(){
    if (!running || gameOver) return;
    if (curName === 'O') return;
    const newRot = (curRot + 1) % 4;
    // try in place, then simple wall kicks left/right (and up for floor kicks)
    const kicks = [[0,0], [-1,0], [1,0], [-2,0], [2,0], [0,-1]];
    for(const [kx,ky] of kicks){
      const attempt = cellsFor(curName, newRot, {x: pos.x + kx, y: pos.y + ky});
      if (!collides(attempt)){
        pos = {x: pos.x + kx, y: pos.y + ky};
        curRot = newRot;
        draw();
        return;
      }
    }
  }

  function tick(){
    if (!running || gameOver) return;
    if (!collides(curCells(), 0, 1)){
      pos.y += 1;
    } else {
      lockPiece();
      return;
    }
    draw();
  }

  function restartTimer(){
    clearInterval(dropTimer);
    dropTimer = setInterval(tick, dropMs);
  }

  function die(){
    gameOver = true;
    running = false;
    clearInterval(dropTimer);
    overlayTitle.textContent = 'Игра окончена';
    overlayTitle.className = 'overlay-title dead';
    overlayText.textContent = 'Счёт: ' + score + ' · нажми «Заново»';
    overlay.classList.add('show');
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  function drawCell(c, gx, gy, size, color){
    const p = 2;
    c.fillStyle = color;
    roundRect(c, gx*size+p, gy*size+p, size-p*2, size-p*2, 4);
    c.fill();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.fillStyle = '#12151a';
    ctx.fillRect(0,0,canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    for(let i=1;i<COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,canvas.height); ctx.stroke();
    }
    for(let j=1;j<ROWS;j++){
      ctx.beginPath(); ctx.moveTo(0,j*cell); ctx.lineTo(canvas.width,j*cell); ctx.stroke();
    }

    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const v = board[r][c];
        if (v) drawCell(ctx, c, r, cell, COLORS[v]);
      }
    }

    // ghost
    const cur = curCells();
    let d = 0;
    while(!collides(cur, 0, d+1)) d++;
    cur.forEach(({x,y}) => {
      const gy = y + d;
      if (gy >= 0){
        ctx.strokeStyle = COLORS[curName];
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 2;
        ctx.strokeRect(x*cell+3, gy*cell+3, cell-6, cell-6);
        ctx.globalAlpha = 1;
      }
    });

    cur.forEach(({x,y}) => {
      if (y >= 0) drawCell(ctx, x, y, cell, COLORS[curName]);
    });
  }

  function drawNext(){
    nctx.clearRect(0,0,nextCanvas.width, nextCanvas.height);
    nctx.fillStyle = '#12151a';
    nctx.fillRect(0,0,nextCanvas.width, nextCanvas.height);
    const size = 20;
    const cells = SHAPES[nextName];
    const minX = Math.min(...cells.map(c=>c[0]));
    const maxX = Math.max(...cells.map(c=>c[0]));
    const minY = Math.min(...cells.map(c=>c[1]));
    const maxY = Math.max(...cells.map(c=>c[1]));
    const w = (maxX-minX+1)*size, h = (maxY-minY+1)*size;
    const offX = (nextCanvas.width - w)/2 - minX*size;
    const offY = (nextCanvas.height - h)/2 - minY*size;
    cells.forEach(([x,y]) => {
      nctx.fillStyle = COLORS[nextName];
      roundRect(nctx, offX+x*size+2, offY+y*size+2, size-4, size-4, 3);
      nctx.fill();
    });
  }

  function reset(){
    board = emptyBoard();
    score = 0; level = 1; lines = 0;
    dropMs = 700;
    gameOver = false;
    running = true;
    scoreEl.textContent = 0;
    levelEl.textContent = 1;
    linesEl.textContent = 0;
    overlay.classList.remove('show');
    nextName = null;
    spawn();
    draw();
    restartTimer();
  }

  function togglePause(){
    if (gameOver) return;
    running = !running;
    if (running){
      overlay.classList.remove('show');
    } else {
      overlayTitle.textContent = 'Пауза';
      overlayTitle.className = 'overlay-title';
      overlayText.textContent = 'Нажми пробел или P, чтобы продолжить';
      overlay.classList.add('show');
    }
  }

  window.addEventListener('keydown', (e) => {
    switch(e.key){
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); move(-1); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); move(1); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); softDrop(); break;
      case 'ArrowUp': case 'w': case 'W': e.preventDefault(); rotate(); break;
      case ' ': e.preventDefault(); hardDrop(); break;
      case 'p': case 'P': togglePause(); break;
      case 'r': case 'R': reset(); break;
    }
  });

  document.getElementById('leftBtn').addEventListener('click', () => move(-1));
  document.getElementById('rightBtn').addEventListener('click', () => move(1));
  document.getElementById('downBtn').addEventListener('click', softDrop);
  document.getElementById('rotBtn').addEventListener('click', rotate);
  restartBtn.addEventListener('click', reset);

  reset();
</script>
</body>
</html>
