<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0e1013;
    --card: #171b21;
    --card-hover: #1c212a;
    --border: #262b34;
    --border-hover: #4fd8c4;
    --text: #eae8e3;
    --text-dim: #888e99;
    --text-faint: #565c68;
    --accent: #4fd8c4;
    --danger: #e0607a;
    --radius: 16px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,216,196,0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 0%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 500px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .backlink{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-faint);
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: color .2s ease;
  }
  .backlink:hover{ color: var(--accent); }

  header{
    text-align: center;
    margin: 30px 0 34px;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before, .eyebrow::after{
    content: "";
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .eyebrow::after{ background: linear-gradient(90deg, var(--accent), transparent); }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 44px);
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }

  header p{
    color: var(--text-dim);
    font-size: 14.5px;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .hud{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    padding: 14px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .hud-stat{
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .hud-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .hud-value{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 20px;
  }

  #best .hud-value{ color: var(--accent); }

  .btn{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    color: var(--text);
    background: var(--card-hover);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
  }
  .btn:hover{ border-color: var(--border-hover); color: var(--accent); }
  .btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .board-frame{
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  .board{
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
    background: #12151a;
    border-radius: 10px;
    padding: 10px;
  }

  .cell-bg{
    background: rgba(255,255,255,0.025);
    border-radius: 8px;
  }

  .tile{
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    color: #0e1013;
    background: var(--accent);
    transition: top .12s ease, left .12s ease, transform .12s ease;
  }

  .tile.pop{ animation: pop .18s ease; }
  @keyframes pop{ 0%{ transform: scale(0.5); } 100%{ transform: scale(1); } }

  .overlay{
    position: absolute;
    inset: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(14,16,19,0.88);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }

  .overlay.show{ display: flex; }

  .overlay-title{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }
  .overlay-title.dead{ color: var(--danger); }
  .overlay-title.win{ color: var(--accent); }

  .overlay p{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
  }

  .hint{
    text-align: center;
    margin-top: 20px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="backlink" href="../../portal.html">← портал</a>

    <header>
      <div class="eyebrow">оффлайн</div>
      <h1>2048</h1>
      <p>Складывай одинаковые числа, добирайся до 2048 и дальше</p>
    </header>

    <div class="hud">
      <div class="hud-stat">
        <span class="hud-label">Счёт</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-stat" id="best">
        <span class="hud-label">Рекорд</span>
        <span class="hud-value" id="bestScore">0</span>
      </div>
      <button class="btn" id="restart">Заново</button>
    </div>

    <div class="board-frame">
      <div class="board" id="board">
        <div class="overlay" id="overlay">
          <div class="overlay-title" id="overlayTitle">Игра окончена</div>
          <p id="overlayText">Счёт: 0</p>
        </div>
      </div>
    </div>

    <div class="hint">стрелки / WASD — сдвиг · свайп на телефоне</div>
  </div>

<script>
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('bestScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const restartBtn = document.getElementById('restart');

  const SIZE = 4;
  let grid, score, best, won, over, cellPx, gapPx;

  best = parseInt(localStorage.getItem('2048-best') || '0', 10);
  bestEl.textContent = best;

  const tileColors = {
    2:   { bg: '#e8f6f3', fg: '#0e1013' },
    4:   { bg: '#c9ede4', fg: '#0e1013' },
    8:   { bg: '#7fe3d0', fg: '#0e1013' },
    16:  { bg: '#4fd8c4', fg: '#0e1013' },
    32:  { bg: '#3cc2b0', fg: '#0e1013' },
    64:  { bg: '#2ba594', fg: '#eae8e3' },
    128: { bg: '#e0a860', fg: '#0e1013' },
    256: { bg: '#e0934f', fg: '#0e1013' },
    512: { bg: '#e07f4f', fg: '#0e1013' },
    1024:{ bg: '#e0607a', fg: '#eae8e3' },
    2048:{ bg: '#c94f74', fg: '#eae8e3' },
  };

  function initBoardBg(){
    for(let i=0;i<SIZE*SIZE;i++){
      const bg = document.createElement('div');
      bg.className = 'cell-bg';
      boardEl.appendChild(bg);
    }
  }
  initBoardBg();

  function measure(){
    const rect = boardEl.getBoundingClientRect();
    const pad = 10, gap = 10;
    gapPx = gap;
    cellPx = (rect.width - pad*2 - gap*(SIZE-1)) / SIZE;
  }

  function reset(){
    grid = Array.from({length:SIZE}, () => Array(SIZE).fill(0));
    score = 0;
    won = false;
    over = false;
    scoreEl.textContent = 0;
    overlay.classList.remove('show');
    addRandomTile();
    addRandomTile();
    measure();
    render();
  }

  function addRandomTile(){
    const empty = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if (grid[r][c] === 0) empty.push([r,c]);
    if (empty.length === 0) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render(){
    document.querySelectorAll('.tile').forEach(t => t.remove());
    const pad = 10;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const v = grid[r][c];
        if (!v) continue;
        const tile = document.createElement('div');
        tile.className = 'tile pop';
        const colors = tileColors[v] || { bg: '#8a4fd8', fg: '#eae8e3' };
        tile.style.background = colors.bg;
        tile.style.color = colors.fg;
        tile.style.width = cellPx + 'px';
        tile.style.height = cellPx + 'px';
        tile.style.left = (pad + c*(cellPx+gapPx)) + 'px';
        tile.style.top = (pad + r*(cellPx+gapPx)) + 'px';
        tile.style.fontSize = (v < 100 ? 30 : v < 1000 ? 24 : 19) + 'px';
        tile.textContent = v;
        boardEl.appendChild(tile);
      }
    }
    scoreEl.textContent = score;
  }

  function slideRow(row){
    let arr = row.filter(v => v !== 0);
    let moved = arr.length !== row.filter(v=>v!==0).length;
    for(let i=0;i<arr.length-1;i++){
      if (arr[i] === arr[i+1]){
        arr[i] *= 2;
        score += arr[i];
        if (arr[i] === 2048 && !won){ won = true; }
        arr.splice(i+1,1);
      }
    }
    while(arr.length < SIZE) arr.push(0);
    return arr;
  }

  function rowsEqual(a,b){
    return a.every((v,i) => v === b[i]);
  }

  function move(dir){
    if (over) return;
    let moved = false;
    const before = grid.map(r => r.slice());

    if (dir === 'left'){
      for(let r=0;r<SIZE;r++) grid[r] = slideRow(grid[r]);
    } else if (dir === 'right'){
      for(let r=0;r<SIZE;r++) grid[r] = slideRow(grid[r].slice().reverse()).reverse();
    } else if (dir === 'up'){
      for(let c=0;c<SIZE;c++){
        let col = grid.map(r => r[c]);
        col = slideRow(col);
        for(let r=0;r<SIZE;r++) grid[r][c] = col[r];
      }
    } else if (dir === 'down'){
      for(let c=0;c<SIZE;c++){
        let col = grid.map(r => r[c]).reverse();
        col = slideRow(col).reverse();
        for(let r=0;r<SIZE;r++) grid[r][c] = col[r];
      }
    }

    moved = !before.every((row,r) => rowsEqual(row, grid[r]));

    if (moved){
      addRandomTile();
      render();
      if (score > best){
        best = score;
        localStorage.setItem('2048-best', best);
        bestEl.textContent = best;
      }
      if (won){
        showOverlay('win');
      } else if (isGameOver()){
        showOverlay('over');
      }
    }
  }

  function isGameOver(){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if (grid[r][c] === 0) return false;
        if (c < SIZE-1 && grid[r][c] === grid[r][c+1]) return false;
        if (r < SIZE-1 && grid[r][c] === grid[r+1][c]) return false;
      }
    }
    return true;
  }

  function showOverlay(kind){
    over = kind === 'over';
    if (kind === 'win'){
      overlayTitle.textContent = 'Есть 2048!';
      overlayTitle.className = 'overlay-title win';
      overlayText.textContent = 'Можно продолжать двигать плитки дальше';
      overlay.classList.add('show');
      setTimeout(() => { if(!over) overlay.classList.remove('show'); }, 1600);
    } else {
      overlayTitle.textContent = 'Игра окончена';
      overlayTitle.className = 'overlay-title dead';
      overlayText.textContent = 'Счёт: ' + score + ' · нажми «Заново» или R';
      overlay.classList.add('show');
    }
  }

  window.addEventListener('keydown', (e) => {
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': e.preventDefault(); move('up'); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); move('down'); break;
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); move('left'); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); move('right'); break;
      case 'r': case 'R': reset(); break;
    }
  });

  restartBtn.addEventListener('click', reset);
  window.addEventListener('resize', () => { measure(); render(); });

  let touchStart = null;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive:true});
  boardEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)){
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
    touchStart = null;
  }, {passive:true});

  reset();
</script>
</body>
</html>
