<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка · портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #0e1013;
    --card: #171b21;
    --card-hover: #1c212a;
    --border: #262b34;
    --border-hover: #4fd8c4;
    --text: #eae8e3;
    --text-dim: #888e99;
    --text-faint: #565c68;
    --accent: #4fd8c4;
    --danger: #e0607a;
    --radius: 16px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,216,196,0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 0%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 620px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .backlink{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-faint);
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: color .2s ease;
  }
  .backlink:hover{ color: var(--accent); }

  header{
    text-align: center;
    margin: 30px 0 34px;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before, .eyebrow::after{
    content: "";
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .eyebrow::after{ background: linear-gradient(90deg, var(--accent), transparent); }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 44px);
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }

  header p{
    color: var(--text-dim);
    font-size: 14.5px;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .hud{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    padding: 14px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .hud-stat{
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .hud-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .hud-value{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 20px;
  }

  #best .hud-value{ color: var(--accent); }

  .btn{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    color: var(--text);
    background: var(--card-hover);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
  }
  .btn:hover{ border-color: var(--border-hover); color: var(--accent); }
  .btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .board-frame{
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  canvas{
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    background: #12151a;
  }

  .overlay{
    position: absolute;
    inset: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(14,16,19,0.86);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }

  .overlay.show{ display: flex; }

  .overlay-title{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }

  .overlay-title.dead{ color: var(--danger); }

  .overlay p{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
  }

  .hint{
    text-align: center;
    margin-top: 20px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  .dpad{
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    justify-content: center;
    margin-top: 26px;
  }

  .dpad button{
    font-size: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .dpad button:active{ background: var(--card-hover); border-color: var(--accent); }

  #up{ grid-column: 2; grid-row: 1; }
  #left{ grid-column: 1; grid-row: 2; }
  #down{ grid-column: 2; grid-row: 2; }
  #right{ grid-column: 3; grid-row: 2; }

  @media (max-width: 560px){
    .dpad{ display: grid; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="backlink" href="../../portal.html">← портал</a>

    <header>
      <div class="eyebrow">оффлайн</div>
      <h1>Змейка</h1>
      <p>Собирай очки, не врезайся в стены и в собственный хвост</p>
    </header>

    <div class="hud">
      <div class="hud-stat">
        <span class="hud-label">Счёт</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-stat" id="best">
        <span class="hud-label">Рекорд</span>
        <span class="hud-value" id="bestScore">0</span>
      </div>
      <button class="btn" id="restart">Заново</button>
    </div>

    <div class="board-frame">
      <canvas id="canvas" width="420" height="420"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlayTitle">Пауза</div>
        <p id="overlayText">Нажми пробел, чтобы продолжить</p>
      </div>
    </div>

    <div class="hint">стрелки / WASD — движение · пробел — пауза</div>

    <div class="dpad">
      <button id="up">↑</button>
      <button id="left">←</button>
      <button id="down">↓</button>
      <button id="right">→</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('bestScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const restartBtn = document.getElementById('restart');

  const COLS = 21, ROWS = 21;
  let cell = canvas.width / COLS;

  const accent = '#4fd8c4';
  const danger = '#e0607a';
  const gridColor = 'rgba(255,255,255,0.035)';

  let snake, dir, nextDir, food, score, best, running, gameOver, tickMs, timer;

  best = parseInt(localStorage.getItem('snake-best') || '0', 10);
  bestEl.textContent = best;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    tickMs = 120;
    gameOver = false;
    running = true;
    scoreEl.textContent = score;
    placeFood();
    overlay.classList.remove('show');
    clearInterval(timer);
    timer = setInterval(tick, tickMs);
  }

  function placeFood(){
    let ok = false;
    while(!ok){
      food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      ok = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function tick(){
    if (!running || gameOver) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)){
      return die();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y){
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (tickMs > 60 && score % 50 === 0){
        tickMs -= 6;
        clearInterval(timer);
        timer = setInterval(tick, tickMs);
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function die(){
    gameOver = true;
    running = false;
    clearInterval(timer);
    if (score > best){
      best = score;
      localStorage.setItem('snake-best', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Игра окончена';
    overlayTitle.className = 'overlay-title dead';
    overlayText.textContent = 'Счёт: ' + score + ' · нажми «Заново» или R';
    overlay.classList.add('show');
    draw();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.fillStyle = '#12151a';
    ctx.fillRect(0,0,canvas.width, canvas.height);

    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for(let i=1;i<COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,canvas.height); ctx.stroke();
    }
    for(let j=1;j<ROWS;j++){
      ctx.beginPath(); ctx.moveTo(0,j*cell); ctx.lineTo(canvas.width,j*cell); ctx.stroke();
    }

    // food
    ctx.fillStyle = danger;
    const fp = 3;
    roundRect(food.x*cell+fp, food.y*cell+fp, cell-fp*2, cell-fp*2, 5);
    ctx.fill();

    // snake
    snake.forEach((s, i) => {
      const p = 2;
      ctx.fillStyle = i === 0 ? accent : 'rgba(79,216,196,' + (0.85 - Math.min(i*0.03,0.5)) + ')';
      roundRect(s.x*cell+p, s.y*cell+p, cell-p*2, cell-p*2, 6);
      ctx.fill();
    });
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function setDir(x,y){
    if (dir.x === -x && dir.y === -y) return;
    if (dir.x === x && dir.y === y && (nextDir.x !== x || nextDir.y !== y)) return;
    nextDir = {x,y};
  }

  function togglePause(){
    if (gameOver) return;
    running = !running;
    if (running){
      overlay.classList.remove('show');
    } else {
      overlayTitle.textContent = 'Пауза';
      overlayTitle.className = 'overlay-title';
      overlayText.textContent = 'Нажми пробел, чтобы продолжить';
      overlay.classList.add('show');
    }
  }

  window.addEventListener('keydown', (e) => {
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDir(0,-1); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDir(0,1); break;
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDir(-1,0); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDir(1,0); break;
      case ' ': e.preventDefault(); togglePause(); break;
      case 'r': case 'R': reset(); break;
    }
  });

  document.getElementById('up').addEventListener('click', () => setDir(0,-1));
  document.getElementById('down').addEventListener('click', () => setDir(0,1));
  document.getElementById('left').addEventListener('click', () => setDir(-1,0));
  document.getElementById('right').addEventListener('click', () => setDir(1,0));

  restartBtn.addEventListener('click', reset);

  // swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive:true});
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)){
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, {passive:true});

  reset();
  draw();
</script>
</body>
</html>
